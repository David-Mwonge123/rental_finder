<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Details | Nairobi Rentals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
  </head>
  <body>
    <nav
      class="flex items-center justify-between px-5 py-4 bg-white shadow-sm sticky top-0 z-10 md:px-10"
    >
      <div class="text-xl font-extrabold">
        Nairobi<span class="text-emerald-600">Rentals</span>
      </div>
      <div class="hidden md:flex gap-6 font-medium text-sm">
        <a href="index.html" class="hover:text-emerald-600">Home</a>
        <a href="listings.html" class="hover:text-emerald-600">Listings</a>
        <a href="about.html" class="hover:text-emerald-600">About</a>
        <a href="about.html#contact" class="hover:text-emerald-600">Contact</a>
        <a href="my-listings.html" class="hover:text-emerald-600"
          >My Listings</a
        >
        <a href="favourites.html">Favourites</a>
      </div>
      <a
        href="add-listing.html"
        class="bg-emerald-600 text-white text-sm font-semibold px-4 py-2 rounded-full hover:bg-emerald-800"
        >Add a Listing
      </a>
    </nav>

    <main class="max-w-6xl mx-auto px-5 md:px-10 py-8">
      <a
        href="listings.html"
        class="text-sm font-medium text-slate-600 hover:text-emerald-600"
        >Back to Listings</a
      >
      <div class="bg-slate-50 rounded-2xl p-4 mt-4">
        <h3 class="font-bold text-sm">Book a Viewing</h3>
        <div class="flex gap-2 mt-3">
          <input
            id="bookDate"
            type="date"
            class="flex-1 px-4 py-2.5 bg-white border rounded-full text-sm outline-none"
          />
          <button
            onclick="bookViewing()"
            class="bg-emerald-600 text-white font-bold text-sm px-5 py-2.5 rounded-full"
          >
            Book
          </button>
        </div>
        <p id="bookMsg" class="hidden text-emerald-600 font-bold text-xs mt-2">
          Booked! See it in My Bookings.
        </p>
      </div>

      <div id="details" class="mt-4"></div>
      <p id="notFound" class="hidden text-center py-16 text-slate-500">
        House not found.
        <a href="listings.html" class="text-emerald-600 font-bold"
          >Go back to listings</a
        >
      </p>
    </main>

    <footer class="bg-white border-t border-slate-200 px-5 py-8 md:px-10">
      <div
        class="flex flex-col md:flex-row md:items-center md:justify-between gap-6 max-w-6xl mx-auto"
      >
        <div class="text-xl font-extrabold">
          Nairobi<span class="text-emerald-600">Rentals</span>
        </div>
        <p>
          Follow us on:
          <a
            href="#"
            aria-label="visit our facebook page"
            class="text-2xl text-emerald-600"
            ><i class="fa-brands fa-square-facebook"></i
          ></a>
          <a
            href="#"
            aria-label="visit our instagram page"
            class="text-2xl text-emerald-600"
            ><i class="fa-brands fa-square-instagram"></i
          ></a>
          <a
            href="#"
            aria-label="visit our tiktok page"
            class="text-2xl text-emerald-600"
            ><i class="fa-brands fa-tiktok"></i
          ></a>
        </p>

        <p class="font-bold">&copy; 2026 Nairobi Rental Finder</p>
      </div>
    </footer>

    <script src="js/script.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const id = Number(params.get("id"));
      const userListings = JSON.parse(
        localStorage.getItem("userListings") || "[]",
      );
      const allListings = [...listings, ...userListings];
      const h = allListings.find((house) => house.id === id);

      function formatType(t) {
        if (t === "1bedroom") return "1 Bedroom";
        if (t === "2bedroom") return "2 Bedroom";
        if (t === "3bedroom") return "3 Bedroom";
        return t;
      }

      if (!h) {
        document.getElementById("notFound").classList.remove("hidden");
      } else {
        const waPhone = "254" + h.phone.slice(1);
        const favs = JSON.parse(localStorage.getItem("favs") || "[]");
        const isFav = favs.includes(h.id);

        document.getElementById("details").innerHTML = `
          <div class="bg-white rounded-2xl overflow-hidden shadow-sm grid md:grid-cols-2">
            <div class="relative">
              <img src="${h.image}" alt="${h.title}" class="w-full h-72 md:h-full object-cover" />
              ${h.isNew ? '<span class="absolute top-4 left-4 bg-emerald-600 text-white text-xs font-bold px-3 py-1 rounded-full">NEW</span>' : ""}
            </div>

            <div class="p-6 md:p-8">
              <div class="flex justify-between items-start gap-4">
                <h1 class="text-2xl md:text-3xl font-extrabold leading-tight">${h.title}</h1>
                <button onclick="toggleFav(${h.id}, this)" class="shrink-0 w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center text-2xl ${isFav ? "text-red-500" : "text-slate-400"}">&#9829;</button>
              </div>

              <p class="text-slate-500 mt-2">${h.area} | ${formatType(h.type)}</p>
              <p class="text-emerald-600 font-extrabold text-3xl mt-4">Ksh ${h.price.toLocaleString()}<span class="text-sm font-normal text-slate-500">/month</span></p>

              <h2 class="font-bold mt-6 mb-2">What you get</h2>
              <div class="flex flex-wrap gap-2 text-sm text-slate-700">
                <span class="bg-slate-100 px-3 py-1.5 rounded-full">Water: ${h.water}</span>
                <span class="bg-slate-100 px-3 py-1.5 rounded-full">Wifi: ${h.wifi}</span>
                <span class="bg-slate-100 px-3 py-1.5 rounded-full">Security: ${h.security}</span>
              </div>

              <h2 class="font-bold mt-6 mb-2">About this house</h2>
              <p class="text-slate-600 text-sm leading-relaxed">
                Spacious and well-lit ${formatType(h.type).toLowerCase()} in ${h.area} with reliable water, good security and easy access to transport. Perfect for anyone looking for a comfortable home in Nairobi.
              </p>

              <div class="flex flex-col sm:flex-row gap-3 mt-8">
                <a href="tel:${h.phone}" class="flex-1 text-center bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-full">Call ${h.phone}</a>
                <a href="https://wa.me/${waPhone}?text=Hi, I saw your ${encodeURIComponent(h.title)} on Nairobi Rentals. Is it still available?" target="_blank" class="flex-1 text-center bg-white border-2 border-emerald-600 text-emerald-700 font-bold py-3 rounded-full">WhatsApp</a>
              </div>
              <p class="text-xs text-slate-400 mt-3 text-center">Landlord replies faster on WhatsApp</p>
            </div>
          </div>
        `;
      }
      function toggleFav(id, btn) {
        let favs = JSON.parse(localStorage.getItem("favs") || "[]");
        if (favs.includes(id)) {
          favs = favs.filter((f) => f !== id);
          btn.classList.remove("text-red-500");
          btn.classList.add("text-slate-400");
        } else {
          favs.push(id);
          btn.classList.remove("text-slate-400");
          btn.classList.add("text-red-500");
        }
        localStorage.setItem("favs", JSON.stringify(favs));
      }
      function bookViewing() {
        const date = document.getElementById("bookDate").value;
        if (!date) return alert("Please pick a date");
        const bookings = JSON.parse(localStorage.getItem("bookings") || "[]");
        bookings.push({
          id: Date.now(),
          houseId: h.id,
          title: h.title,
          area: h.area,
          price: h.price,
          image: h.image,
          phone: h.phone,
          date,
        });
        localStorage.setItem("bookings", JSON.stringify(bookings));
        document.getElementById("bookMsg").classList.remove("hidden");
        setTimeout(() => (window.location.href = "my-bookings.html"), 800);
      }
    </script>
  </body>
</html>
