<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Listing | Nairobi Rentals</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <nav
      class="flex items-center justify-between px-5 py-4 bg-white shadow-sm sticky top-0 z-10 md:px-10"
    >
      <div class="text-xl font-extrabold">
        Nairobi<span class="text-emerald-600">Rentals</span>
      </div>
      <div class="hidden md:flex gap-6 font-medium text-sm">
        <a href="my-listings.html" class="hover:text-emerald-600"
          >My Listings</a
        >
      </div>
    </nav>
    <h1 class="text-2xl font-extrabold m-4">Edit Your Listing</h1>
    <p class="text-slate-500 text-sm mt-1 m-4">
      Change anything, then Save. It updates instantly.
    </p>

    <form
      action="#"
      id="editForm"
      class="bg-white rounded-2xl shadow-sm p-6 mt-6 space-y-4"
    >
      <div>
        <label class="font-bold text-sm">House Title</label
        ><input
          id="title"
          required
          placeholder="e.g Spacious Studio"
          class="w-full mt-1 px-4 py-3 bg-slate-100 rounded-xl outline-none text-sm"
        />
      </div>
      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="font-bold text-sm">Area</label>
          <select
            id="area"
            required
            class="w-full mt-1 px-4 py-3 bg-slate-100 rounded-xl outline-none text-sm"
          >
            <option value="">Select Area</option>
            <option>Westlands</option>
            <option>Kilimani</option>
            <option>Ruaka</option>
            <option>Roysambu</option>
            <option>Ngong</option>
            <option>Kileleshwa</option>
            <option>Embakasi</option>
            <option>Umoja</option>
            <option>Thika</option>
            <option>Kasarani</option>
          </select>
        </div>
        <div>
          <label class="font-bold text-sm">Type</label>
          <select
            id="type"
            required
            class="w-full mt-1 px-4 py-3 bg-slate-100 rounded-xl outline-none text-sm"
          >
            <option value="">Select Type</option>
            <option value="Bedsitter">Bedsitter</option>
            <option value="Studio">Studio</option>
            <option value="1bedroom">1 Bedroom</option>
            <option value="2bedroom">2 Bedroom</option>
            <option value="3bedroom">3 Bedroom</option>
          </select>
        </div>
      </div>
      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="font-bold text-sm">Price per month (Ksh)</label
          ><input
            id="price"
            type="number"
            required
            placeholder="e.g 15000"
            min="1000"
            class="w-full mt-1 px-4 py-3 bg-slate-100 rounded-xl outline-none text-sm"
          />
        </div>
        <div>
          <label class="font-bold text-sm">Your Phone number</label
          ><input
            id="phone"
            required
            placeholder="e.g 0700000000"
            class="w-full mt-1 px-4 py-3 bg-slate-100 rounded-xl outline-none text-sm"
          />
        </div>
      </div>
      <div class="grid sm:grid-cols-3 gap-4">
        <div>
          <label class="font-bold text-sm">Water</label
          ><select
            id="water"
            class="w-full mt-1 px-4 py-3 bg-slate-100 rounded-xl outline-none text-sm"
          >
            <option>24/7</option>
            <option>Daily</option>
            <option>Twice a week</option>
          </select>
        </div>
        <div>
          <label class="font-bold text-sm">Wifi</label
          ><select
            id="wifi"
            class="w-full mt-1 px-4 py-3 bg-slate-100 rounded-xl outline-none text-sm"
          >
            <option>Free Wifi</option>
            <option>Available</option>
            <option>Not Available</option>
          </select>
        </div>
        <div>
          <label class="font-bold text-sm">Security</label
          ><select
            id="security"
            class="w-full mt-1 px-4 py-3 bg-slate-100 rounded-xl outline-none text-sm"
          >
            <option>CCTV</option>
            <option>Guard</option>
            <option>Guard + CCTV</option>
          </select>
        </div>
      </div>
      <div>
        <label class="font-bold text-sm">House Photo</label
        ><input
          id="imageInput"
          type="file"
          accept="image/*"
          class="w-full mt-1 text-sm"
        /><img
          id="preview"
          class="hidden w-full h-48 object-cover rounded-xl mt-3"
        />
      </div>
      <button
        class="w-full bg-emerald-600 text-white font-bold py-3 rounded-full"
      >
        Save Changes
      </button>
      <p
        id="successMsg"
        class="hidden text-center text-emerald-600 font-bold text-sm"
      >
        Updated! Redirecting...
      </p>
    </form>
  </body>
</html>
