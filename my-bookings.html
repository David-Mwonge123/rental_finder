<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Bookings | Nairobi Rentals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
  </head>
  <body>
    <nav
      class="flex items-center justify-between px-5 py-4 bg-white shadow-sm sticky top-0 z-10 md:px-10"
    >
      <div class="text-xl font-extrabold">
        Nairobi<span class="text-emerald-600">Rentals</span>
      </div>
      <div class="hidden md:flex gap-6 font-medium text-sm">
        <a href="index.html" class="hover:text-emerald-600">Home</a>
        <a href="listings.html" class="hover:text-emerald-600">Listings</a>
        <a href="about.html" class="hover:text-emerald-600">About</a>
        <a href="about.html#contact" class="hover:text-emerald-600">Contact</a>
         <a href="my-listings.html" class="hover:text-emerald-600"
          >My Listings</a
        >
        <a href="favourites.html" class="hover:text-emerald-600">Favourites</a>
        <a href="compare.html" class="hover:text-emerald-600"
          >Compare</a
        >
        <a href="calculator.html" class="hover:text-emerald-600">Calculator</a>
        <a href="dashboard.html" class="hover:text-emerald-600">Dashboard</a>
      </div>
      <a
        href="add-listing.html"
        class="bg-emerald-600 text-white text-sm font-semibold px-4 py-2 rounded-full hover:bg-emerald-800"
        >Add a Listing
      </a>
    </nav>
    <main class="max-w-3xl mx-auto px-5 md:px-10 py-8">
      <h1 class="text-2xl font-extrabold">My Bookings</h1>
      <p id="count" class="text-sm text-slate-500 mt-2"></p>
      <div id="list" class="space-y-4 mt-6"></div>
      <div id="empty" class="hidden text-center py-16">
        <p class="text-slate-500">No bookings yet.</p>
        <a
          href="listings.html"
          class="inline-block mt-4 bg-emerald-600 text-white font-bold px-6 py-2.5 rounded-full"
          >Find a House</a
        >
      </div>
    </main>
    <script>
      function renderBookings() {
        const b = JSON.parse(localStorage.getItem("bookings") || "[]");
        document.getElementById("count").textContent =
          `You have ${b.length} viewing(s)`;
        document
          .getElementById("empty")
          .classList.toggle("hidden", b.length > 0);
        document.getElementById("list").innerHTML = b
          .map(
            (x) => `
      <div class="bg-white rounded-2xl p-4 flex gap-4 items-center shadow-sm">
        <img src="${x.image}" class="w-20 h-20 object-cover rounded-xl" />
        <div class="flex-1">
          <h3 class="font-bold text-sm">${x.title}</h3>
          <p class="text-xs text-slate-500">${x.area} | Ksh ${x.price.toLocaleString()}/month</p>
          <p class="text-xs font-bold text-emerald-600 mt-1">${x.date}</p>
        </div>
        <div class="flex flex-col gap-2">
          <a href="https://wa.me/${x.phone}?text=${encodeURIComponent("Hi, I booked a viewing for " + x.title + " on " + x.date)}" target="_blank" class="bg-emerald-600 text-white text-xs font-bold px-3 py-2 rounded-full text-center">WhatsApp</a>
          <button onclick="cancelBooking(${x.id})" class="bg-red-50 text-red-600 text-xs font-bold px-3 py-2 rounded-full">Cancel</button>
        </div>
      </div>`,
          )
          .join("");
      }
      function cancelBooking(id) {
        let b = JSON.parse(localStorage.getItem("bookings") || "[]");
        b = b.filter((x) => x.id !== id);
        localStorage.setItem("bookings", JSON.stringify(b));
        renderBookings();
      }
      renderBookings();
    </script>
  </body>
</html>
