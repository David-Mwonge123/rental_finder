<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compare | Nairobi Rentals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
  </head>
  <body>
    <nav
      class="flex items-center justify-between px-5 py-4 bg-white shadow-sm sticky top-0 z-10 md:px-10"
    >
      <div class="text-xl font-extrabold">
        Nairobi<span class="text-emerald-600">Rentals</span>
      </div>
      <div class="hidden md:flex gap-6 font-medium text-sm">
        <a href="index.html" class="hover:text-emerald-600">Home</a>
        <a href="listings.html" class="hover:text-emerald-600">Listings</a>
        <a href="about.html" class="hover:text-emerald-600">About</a>
        <a href="about.html#contact" class="hover:text-emerald-600">Contact</a>
        <a href="my-listings.html" class="hover:text-emerald-600"
          >My Listings</a
        >
        <a href="favourites.html">Favourites</a>
      </div>
      <a
        href="add-listing.html"
        class="bg-emerald-600 text-white text-sm font-semibold px-4 py-2 rounded-full hover:bg-emerald-800"
        >Add a Listing
      </a>
    </nav>
    <main class="max-w-5xl mx-auto px-5 md:px-10 py-8">
      <h1 class="text-2xl font-extrabold">Compare Houses</h1>
      <p class="text-sm text-slate-500 mt-1">
        Pick 2 houses to compare side-by-side.
      </p>

      <div class="grid md:grid-cols-2 gap-4 mt-6">
        <select
          id="houseA"
          onchange="compare()"
          class="w-full px-4 py-3 bg-white border rounded-xl text-sm outline-none"
        ></select>
        <select
          id="houseB"
          onchange="compare()"
          class="w-full px-4 py-3 bg-white border rounded-xl text-sm outline-none"
        ></select>
      </div>

      <div id="result" class="grid md:grid-cols-2 gap-4 mt-6"></div>
      <p id="winner" class="text-center font-bold text-emerald-600 mt-6"></p>
    </main>
    <footer class="bg-white border-t border-slate-200 px-5 py-8 md:px-10">
      <div
        class="flex flex-col md:flex-row md:items-center md:justify-between gap-6 max-w-6xl mx-auto"
      >
        <div class="text-xl font-extrabold">
          Nairobi<span class="text-emerald-600">Rentals</span>
        </div>
        <p>
          Follow us on:
          <a
            href="#"
            aria-label="visit our facebook page"
            class="text-2xl text-emerald-600"
            ><i class="fa-brands fa-square-facebook"></i
          ></a>
          <a
            href="#"
            aria-label="visit our instagram page"
            class="text-2xl text-emerald-600"
            ><i class="fa-brands fa-square-instagram"></i
          ></a>
          <a
            href="#"
            aria-label="visit our tiktok page"
            class="text-2xl text-emerald-600"
            ><i class="fa-brands fa-tiktok"></i
          ></a>
        </p>

        <p class="font-bold">&copy; 2026 Nairobi Rental Finder</p>
      </div>
    </footer>
    <script src="js/script.js"></script>
    <script>
      const all = [
        ...listings,
        ...JSON.parse(localStorage.getItem("userListings") || "[]"),
      ];
      const opts = all
        .map(
          (h) =>
            `<option value="${h.id}">${h.title} - Ksh ${h.price.toLocaleString()}</option>`,
        )
        .join("");
      document.getElementById("houseA").innerHTML = opts;
      document.getElementById("houseB").innerHTML = opts;
      document.getElementById("houseB").selectedIndex = 1;

      function card(h) {
        return `<div class="bg-white rounded-2xl overflow-hidden shadow-sm">
      <img src="${h.image}" class="w-full h-48 object-cover" />
      <div class="p-5 text-sm space-y-2">
        <h3 class="font-bold text-base">${h.title}</h3>
        <p>${h.area}</p>
        <p>${h.type} | ${h.beds} Bed | ${h.baths} Bath</p>
        <p class="text-emerald-600 font-extrabold text-lg">Ksh ${h.price.toLocaleString()}/month</p>
        <p>Water: ${h.water || "N/A"} | Wifi: ${h.wifi || "N/A"} | Security: ${h.security || "N/A"}</p>
        <a href="details.html?id=${h.id}" class="block text-center bg-emerald-600 text-white font-bold py-2.5 rounded-full mt-3">View Details</a>
      </div>
    </div>`;
      }
      function compare() {
        const a = all.find(
          (h) => h.id == document.getElementById("houseA").value,
        );
        const b = all.find(
          (h) => h.id == document.getElementById("houseB").value,
        );
        if (!a || !b) return;
        document.getElementById("result").innerHTML = card(a) + card(b);
        const cheaper = a.price < b.price ? a.title : b.title;
        const diff = Math.abs(a.price - b.price).toLocaleString();
        document.getElementById("winner").textContent =
          a.price === b.price
            ? "Same price!"
            : `${cheaper} is cheaper by Ksh ${diff}/month`;
      }
      compare();
    </script>
  </body>
</html>
