<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listings | Nairobi Rentals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
  </head>
  <body>
    <nav
      class="flex items-center justify-between px-5 py-4 bg-white shadow-sm sticky top-0 z-10 md:px-10"
    >
      <div class="text-xl font-extrabold">
        Nairobi<span class="text-emerald-600">Rentals</span>
      </div>
      <div class="hidden md:flex gap-6 font-medium text-sm">
        <a href="index.html" class="hover:text-emerald-600">Home</a>
        <a href="listings.html" class="hover:text-emerald-600">Listings</a>
        <a href="about.html" class="hover:text-emerald-600">About</a>
        <a href="about.html#contact" class="hover:text-emerald-600">Contact</a>
        <a href="my-listings.html" class="hover:text-emerald-600">My Listings</a>
      </div>
      <a
        href="add-listing.html"
        class="bg-emerald-600 text-white text-sm font-semibold px-4 py-2 rounded-full hover:bg-emerald-800"
        >Add a Listing</a
      >
    </nav>
    <section class="max-w-6xl mx-auto px-5 md:px-10 pt-8 mb-10">
      <h1 class="text-2xl md:text-3xl font-extrabold">
        All Rentals in Nairobi
      </h1>
      <p id="resultCount" class="text-sm text-slate-500 mt-5 mb-5">
        Showing 12 houses
      </p>
      <select
        name="filterArea"
        id="filterArea"
        class="flex-1 px-4 py-3 rounded-xl md:rounded-full bg-slate-100 outline-none text-sm font-medium"
      >
        <option value="">All Areas</option>
        <option value="Westlands">Westlands</option>
        <option value="Kilimani">Kilimani</option>
        <option value="Ruaka">Ruaka</option>
        <option value="Roysambu">Roysambu</option>
        <option value="Ngong">Ngong</option>
        <option value="Kileleshwa">Kileleshwa</option>
        <option value="Embakasi">Embakasi</option>
        <option value="Umoja">Umoja</option>
        <option value="Thika">Thika road</option>
        <option value="Kasarani">Kasarani</option>
      </select>
      <select
        name="filterType"
        id="filterType"
        class="flex-1 px-4 py-3 rounded-xl md:rounded-full bg-slate-100 outline-none text-sm font-medium"
      >
        <option value="">All Types</option>
        <option value="Bedsitter">Bedsitter</option>
        <option value="Studio">Studio</option>
        <option value="1bedroom">1 Bedroom</option>
        <option value="2bedroom">2 Bedroom</option>
        <option value="3bedroom">3 Bedroom</option>
      </select>
      <select
        name="filterPrice"
        id="filterPrice"
        class="flex-1 px-4 py-3 rounded-xl md:rounded-full bg-slate-100 outline-none text-sm font-medium"
      >
        <option value="">Any Price</option>
        <option value="0-20000">Under Ksh 20,000</option>
        <option value="20000-40000">Ksh 20,000 - 40,000</option>
        <option value="40000-70000">Ksh 40,000 - 70,000</option>
        <option value="70000-999999">Ksh 70,000 +</option>
      </select>
      <select
        name="sortBy"
        id="sortBy"
        class="flex-1 px-4 py-3 rounded-xl md:rounded-full bg-slate-100 outline-none text-sm font-medium"
      >
        <option value="newest">Newest</option>
        <option value="cheapest">Cheapest</option>
        <option value="expensive">Most Expensive</option>
      </select>
    </section>
    <main class="max-w-6xl mx-auto px-5 md:px-10 pb-12">
      <div
        id="listingsGrid"
        class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"
      ></div>
      <p id="noResults" class="hidden text-center text-slate-500 py-12">
        No houses found. Try clearing filters.
      </p>
    </main>
    <footer class="bg-white border-t border-slate-200 px-5 py-8 md:px-10">
      <div
        class="flex flex-col md:flex-row md:items-center md:justify-between gap-6 max-w-6xl mx-auto"
      >
        <div class="text-xl font-extrabold">
          Nairobi<span class="text-emerald-600">Rentals</span>
        </div>
        <p>
          Follow us on:
          <a
            href="#"
            aria-label="visit our facebook page"
            class="text-2xl text-emerald-600"
            ><i class="fa-brands fa-square-facebook"></i
          ></a>
          <a
            href="#"
            aria-label="visit our instagram page"
            class="text-2xl text-emerald-600"
            ><i class="fa-brands fa-square-instagram"></i
          ></a>
          <a
            href="#"
            aria-label="visit our tiktok page"
            class="text-2xl text-emerald-600"
            ><i class="fa-brands fa-tiktok"></i
          ></a>
        </p>

        <p class="font-bold">&copy; 2026 Nairobi Rental Finder</p>
      </div>
    </footer>
    <script src="js/script.js"></script>
    <script>
      const grid = document.getElementById("listingsGrid");
      const areaEl = document.getElementById("filterArea");
      const typeEl = document.getElementById("filterType");
      const priceEl = document.getElementById("filterPrice");
      const sortEl = document.getElementById("sortBy");

      const params = new URLSearchParams(window.location.search);
      if (params.get("area")) areaEl.value = params.get("area");
      if (params.get("type")) typeEl.value = params.get("type");
      if (params.get("price")) {
        let p = params.get("price");
        if (p === "70000+") p = "70000-999999";
        priceEl.value = p;
      }

      function formatType(t) {
        if (t === "1bedroom") return "1 Bedroom";
        if (t === "2bedroom") return "2 Bedroom";
        if (t === "3bedroom") return "3 Bedroom";
        return t;
      }
      function render() {
        const userListings = JSON.parse(
          localStorage.getItem("userListings") || "[]",
        );
        const allListings = [...listings, ...userListings];
        let filtered = [...allListings];

        if (areaEl.value)
          filtered = filtered.filter((h) => h.area === areaEl.value);
        if (typeEl.value)
          filtered = filtered.filter((h) => h.type === typeEl.value);
        if (priceEl.value) {
          const [min, max] = priceEl.value.split("-").map(Number);
          filtered = filtered.filter((h) => h.price >= min && h.price <= max);
        }
        if (sortEl.value === "cheapest")
          filtered.sort((a, b) => a.price - b.price);
        if (sortEl.value === "expensive")
          filtered.sort((a, b) => b.price - a.price);
        if (sortEl.value === "newest")
          filtered.sort((a, b) => (b.isNew ? 1 : 0) - (a.isNew ? 1 : 0));
        document.getElementById("resultCount").textContent =
          `Showing ${filtered.length} houses`;
        document
          .getElementById("noResults")
          .classList.toggle("hidden", filtered.length > 0);
        grid.innerHTML = filtered
          .map(
            (h) => `
        <article class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md">
          <div class="relative">
            <img src="${h.image}" alt="${h.title}" class="w-full h-52 object-cover" />
            ${h.isNew ? '<span class="absolute top-3 left-3 bg-emerald-600 text-white text-xs font-bold px-3 py-1 rounded-full">NEW</span>' : ""}
            <button onclick="toggleFav(${h.id}, this)" class="absolute top-3 right-3 w-9 h-9 bg-white rounded-full flex items-center justify-center text-slate-400 hover:text-red-500">&#9829;</button>
          </div>
          <div class="p-5">
            <div class="flex justify-between items-start">
              <h3 class="font-bold leading-tight">${h.title}</h3>
            </div>
            <p class="text-sm text-slate-500 mt-1">${h.area} | ${formatType(h.type)}</p>
            <p class="text-emerald-600 font-extrabold text-lg mt-2">Ksh ${h.price.toLocaleString()}<span class="text-sm font-normal text-slate-500">/month</span></p>
            <div class="flex flex-wrap gap-2 mt-3 text-xs text-slate-600">
             <span class="bg-slate-100 px-2 py-1 rounded-full">Water: ${h.water}</span>
             <span class="bg-slate-100 px-2 py-1 rounded-full">Wifi: ${h.wifi}</span>
             <span class="bg-slate-100 px-2 py-1 rounded-full">Security: ${h.security}</span>
            </div>
            
            <a href="details.html?id=${h.id}" class="block text-center mt-4 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold py-2.5 rounded-full">View Details</a>
          </div>
        </article>
      `,
          )
          .join("");
      }
      function toggleFav(id, btn) {
        let favs = JSON.parse(localStorage.getItem("favs") || "[]");
        if (favs.includes(id)) {
          favs = favs.filter((f) => f !== id);
          btn.style.color = "";
        } else {
          favs.push(id);
          btn.style.color = "red";
        }
        localStorage.setItem("favs", JSON.stringify(favs));
      }

      [areaEl, typeEl, priceEl, sortEl].forEach((el) =>
        el.addEventListener("change", render),
      );
      render();
    </script>
  </body>
</html>
