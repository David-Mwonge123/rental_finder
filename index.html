<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NAIROBI RENTAL FINDER</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 font-sans text-slate-900">
    <nav
      class="flex items-center justify-between px-5 py-4 bg-white shadow-sm sticky top-0 z-10 md:px-10"
    >
      <div class="text-xl font-extrabold">
        Nairobi<span class="text-emerald-600">Rentals</span>
      </div>
      <div class="hidden md:flex gap-6 font-medium text-sm">
        <a href="" class="hover:text-emerald-600">Home</a>
        <a href="" class="hover:text-emerald-600">Listings</a>
        <a href="" class="hover:text-emerald-600">About</a>
        <a href="" class="hover:text-emerald-600">Contact</a>
      </div>
      <button
        class="bg-emerald-600 text-white text-sm font-semibold px-4 py-2 rounded-full hover:bg-emerald-800"
      >
        List Properties
      </button>
    </nav>

    <img
      src="images/apartments.jpg"
      alt="Apartments in Nairobi"
      class="w-full h-[520px] md:h-[580px] object-cover"
    />
    <span
      class="bg-white/15 border border-white/30 text-xs md:text-sm font-medium px-4 py-1.5 rounded-full mb-4"
    >
      Over 1,200 verified rentals in Nairobi
    </span>

    <h1 class="text-4xl md:text-6xl font-extrabold leading-tight max-w-3xl">
      Find A Home You Love,<br />In Nairobi
    </h1>
    <p class="mt-4 text-slate-200 text-base md:text-lg max-w-xl">
      Bedsitter, 1 & 2 bedrooms in Westlands, Kilimani, Ruaka, Roysambu and
      more. No brokers, no hidden fees!
    </p>
    <form
      action=""
      class="mt-8 w-full max-w-3xl bg-white rounded-2xl md:rounded-full p-2 flex flex-col md:flex-row gap-2 shadow-2xl text-slate-900"
    >
      <select
        name=""
        id=""
        class="flex-1 px-4 py-3 rounded-xl md:rounded-full bg-slate-100 outline-none text-sm font-medium"
      >
        <option value="">All Areas</option>
        <option value="">Westlands</option>
        <option value="">Kilimani</option>
        <option value="">Ruaka</option>
        <option value="">Roysambu</option>
        <option value="">Ngong</option>
        <option value="">Kileleshwa</option>
        <option value="">Embakasi</option>
        <option value="">Umoja</option>
        <option value="">Thika road</option>
        <option value="">Kasarani</option>
      </select>
      <select
        name=""
        id=""
        class="flex-1 px-4 py-3 rounded-xl md:rounded-full bg-slate-100 outline-none text-sm font-medium"
      >
        <option value="">All Types</option>
        <option value="">Bedsitter</option>
        <option value="">Studio</option>
        <option value="">1 Bedroom</option>
        <option value="">2 Bedroom</option>
        <option value="">3 Bedroom</option>
      </select>
      <select
        name=""
        id=""
        class="flex-1 px-4 py-3 rounded-xl md:rounded-full bg-slate-100 outline-none text-sm font-medium"
      >
        <option value="">Any Price</option>
        <option value="">Under Ksh 20,000</option>
        <option value="">Ksh 20,000 - 40,000</option>
        <option value="">Ksh 40,000 - 70,000</option>
        <option value="">Ksh 70,000 +</option>
      </select>
    </form>
    <div class="mt-6 flex gap-6 md:gap-10 text-sm">
      <div>
        <p class="font-bold text-lg">1,200+</p>
        <p class="text-slate-300">Listings</p>
      </div>
      <div>
        <p class="font-bold text-lg">10 Areas</p>
        <p class="text-slate-300">Covered</p>
      </div>
      <div>
        <p class="font-bold text-lg">Verified</p>
        <p class="text-slate-300">Landlords</p>
      </div>
    </div>
  </body>
</html>
