<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | Nairobi Rentals</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <nav
      class="flex items-center justify-between px-5 py-4 bg-white shadow-sm sticky top-0 z-10 md:px-10"
    >
      <div class="text-xl font-extrabold">
        Nairobi<span class="text-emerald-600">Rentals</span>
      </div>
      <div class="hidden md:flex gap-6 font-medium text-sm">
        <a href="index.html" class="hover:text-emerald-600">Home</a>
      </div>
    </nav>
    <main class="max-w-md mx-auto px-5 py-8">
      <h1 class="text-2xl font-extrabold text-center">Lister Account</h1>
      <p class="text-sm text-slate-500 text-center mt-1">
        Only verified listers can add houses.
      </p>

      <div
        id="authBox"
        class="bg-white rounded-2xl shadow-sm p-6 mt-6 space-y-4"
      >
        <div>
          <label class="font-bold text-sm">Full Name</label>
          <input
            id="authName"
            placeholder="e.g. David Mwonge"
            required
            class="w-full mt-1 px-4 py-3 bg-slate-100 rounded-xl outline-none text-sm"
          />
        </div>
        <div>
          <label class="font-bold text-sm">Phone Number</label>
          <input
            id="authPhone"
            placeholder="0700000000"
            required
            class="w-full mt-1 px-4 py-3 bg-slate-100 rounded-xl outline-none text-sm"
          />
        </div>
        <div>
          <label class="font-bold text-sm">Password</label>
          <input
            id="authPass"
            type="password"
            placeholder="*****"
            required
            class="w-full mt-1 px-4 py-3 bg-slate-100 rounded-xl outline-none text-sm"
          />
        </div>
        <button
          onclick="doAuth()"
          class="w-full bg-emerald-600 text-white font-bold py-3 rounded-full"
        >
          Create Account / Login
        </button>
        <p class="text-xs text-slate-400 text-center">
          If phone exists, we log you in. If new, we create account.
        </p>
        <p id="authMsg" class="hidden text-center text-sm font-bold"></p>
      </div>

      <div
        id="verifyBox"
        class="hidden bg-white rounded-2xl shadow-sm p-6 mt-4 space-y-4"
      >
        <h2 class="font-bold">Verify Your Number</h2>
        <p class="text-sm text-slate-500">
          We sent a code to your phone. <br /><b>DEMO CODE: 1234</b>
        </p>
        <input
          id="verifyCode"
          placeholder="Enter 1234"
          class="w-full px-4 py-3 bg-slate-100 rounded-xl outline-none text-sm"
        />
        <button
          onclick="doVerify()"
          class="w-full bg-emerald-600 text-white font-bold py-3 rounded-full"
        >
          Verify Me
        </button>
        <p
          id="verifyMsg"
          class="hidden text-center text-sm font-bold text-red-500"
        ></p>
      </div>

      <div
        id="loggedInBox"
        class="hidden bg-white rounded-2xl shadow-sm p-6 mt-6 text-center"
      >
        <p id="welcomeText" class="font-bold mt-2"></p>
        <p id="statusText" class="text-sm text-slate-500 mt-1"></p>
        <a
          href="add-listing.html"
          class="inline-block mt-4 bg-emerald-600 text-white font-bold text-sm px-6 py-3 rounded-full"
          >Add a Listing</a
        >
        <button
          onclick="logout()"
          class="block mx-auto mt-3 text-sm text-red-500 font-bold"
        >
          Logout
        </button>
      </div>
    </main>
    <script>
      function getUsers() {
        return JSON.parse(localStorage.getItem("users") || "[]");
      }
      function getCurrent() {
        return JSON.parse(localStorage.getItem("currentUser") || "null");
      }

      function showState() {
        const cur = getCurrent();
        if (!cur) {
          return;
        }
        document.getElementById("authBox").classList.add("hidden");
        if (!cur.verified) {
          document.getElementById("verifyBox").classList.remove("hidden");
        } else {
          document.getElementById("verifyBox").classList.add("hidden");
          document.getElementById("loggedInBox").classList.remove("hidden");
          document.getElementById("welcomeText").textContent =
            "Welcome, " + cur.name;
          document.getElementById("statusText").textContent =
            cur.phone + " • Verified Lister ✓";
        }
      }

      function doAuth() {
        const name = document.getElementById("authName").value.trim();
        const phone = document.getElementById("authPhone").value.trim();
        const pass = document.getElementById("authPass").value.trim();
        const msg = document.getElementById("authMsg");
        if (!phone || !pass) {
          msg.textContent = "Enter phone + password";
          msg.classList.remove("hidden");
          return;
        }
        if (phone.length < 10) {
          msg.textContent = "Enter a valid Kenyan number e.g. 0700000000";
          msg.classList.remove("hidden");
          return;
        }

        let users = getUsers();
        let user = users.find((u) => u.phone === phone);
        if (user) {
          if (user.password !== pass) {
            msg.textContent = "Wrong password for this number";
            msg.classList.remove("hidden");
            return;
          }
        } else {
          if (!name) {
            msg.textContent = "Enter your name to create account";
            msg.classList.remove("hidden");
            return;
          }
          user = {
            name,
            phone,
            password: pass,
            verified: false,
            createdAt: Date.now(),
          };
          users.push(user);
          localStorage.setItem("users", JSON.stringify(users));
        }
        localStorage.setItem("currentUser", JSON.stringify(user));
        showState();
      }

      function doVerify() {
        const code = document.getElementById("verifyCode").value.trim();
        if (code !== "1234") {
          document.getElementById("verifyMsg").textContent =
            "Wrong code. Demo code is 1234";
          document.getElementById("verifyMsg").classList.remove("hidden");
          return;
        }
        let users = getUsers();
        let cur = getCurrent();
        cur.verified = true;
        users = users.map((u) => (u.phone === cur.phone ? cur : u));
        localStorage.setItem("users", JSON.stringify(users));
        localStorage.setItem("currentUser", JSON.stringify(cur));
        showState();
      }

      function logout() {
        localStorage.removeItem("currentUser");
        location.reload();
      }
      showState();
    </script>
  </body>
</html>
