<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Affordability Calculator | Nairobi Rentals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
  </head>
  <body>
    <nav
      class="flex items-center justify-between px-5 py-4 bg-white shadow-sm sticky top-0 z-10 md:px-10"
    >
      <div class="text-xl font-extrabold">
        Nairobi<span class="text-emerald-600">Rentals</span>
      </div>
      <div class="hidden md:flex gap-6 font-medium text-sm">
        <a href="index.html" class="hover:text-emerald-600">Home</a>
        <a href="listings.html" class="hover:text-emerald-600">Listings</a>
        <a href="about.html" class="hover:text-emerald-600">About</a>
        <a href="about.html#contact" class="hover:text-emerald-600">Contact</a>
        <a href="my-listings.html" class="hover:text-emerald-600"
          >My Listings</a
        >
        <a href="favourites.html" class="hover:text-emerald-600">Favourites</a>
        <a href="my-bookings.html" class="hover:text-emerald-600"
          >My Bookings</a
        >
      </div>
      <a
        href="add-listing.html"
        class="bg-emerald-600 text-white text-sm font-semibold px-4 py-2 rounded-full hover:bg-emerald-800"
        >Add a Listing
      </a>
    </nav>
    <main class="max-w-md mx-auto px-5 py-8">
      <h1 class="text-2xl font-extrabold">Can You Afford It?</h1>
      <p class="text-sm text-slate-500 mt-1">
        Rule: Rent should be max 30% of your income.
      </p>

      <div class="bg-white rounded-2xl p-6 shadow-sm mt-6 space-y-4">
        <div>
          <label class="text-sm font-bold">Monthly Income (Ksh)</label>
          <input
            id="income"
            type="number"
            placeholder="e.g. 50000"
            oninput="calc()"
            class="w-full mt-1 px-4 py-3 bg-slate-100 rounded-xl outline-none text-sm"
          />
        </div>
        <div>
          <label class="text-sm font-bold">House Rent (Ksh)</label>
          <input
            id="rent"
            type="number"
            placeholder="e.g. 15000"
            oninput="calc()"
            class="w-full mt-1 px-4 py-3 bg-slate-100 rounded-xl outline-none text-sm"
          />
        </div>
        <div>
          <label class="text-sm font-bold">Other Monthly Expenses (Ksh)</label>
          <input
            id="expenses"
            type="number"
            placeholder="e.g. 10000"
            value="0"
            oninput="calc()"
            class="w-full mt-1 px-4 py-3 bg-slate-100 rounded-xl outline-none text-sm"
          />
        </div>
      </div>

      <div
        id="result"
        class="hidden bg-white rounded-2xl p-6 shadow-sm mt-4 text-center"
      >
        <p id="verdict" class="text-xl font-extrabold"></p>
        <p id="detail" class="text-sm text-slate-500 mt-2"></p>
        <div class="w-full bg-slate-100 rounded-full h-3 mt-4 overflow-hidden">
          <div id="bar" class="h-3 rounded-full" style="width: 0%"></div>
        </div>
        <p id="percent" class="text-xs text-slate-500 mt-2"></p>
        <a
          href="listings.html"
          class="inline-block mt-4 bg-emerald-600 text-white font-bold text-sm px-6 py-2.5 rounded-full"
          >Find Houses In Budget</a
        >
      </div>
    </main>
    <footer class="bg-white border-t border-slate-200 px-5 py-8 md:px-10">
      <div
        class="flex flex-col md:flex-row md:items-center md:justify-between gap-6 max-w-6xl mx-auto"
      >
        <div class="text-xl font-extrabold">
          Nairobi<span class="text-emerald-600">Rentals</span>
        </div>
        <p>
          Follow us on:
          <a
            href="#"
            aria-label="visit our facebook page"
            class="text-2xl text-emerald-600"
            ><i class="fa-brands fa-square-facebook"></i
          ></a>
          <a
            href="#"
            aria-label="visit our instagram page"
            class="text-2xl text-emerald-600"
            ><i class="fa-brands fa-square-instagram"></i
          ></a>
          <a
            href="#"
            aria-label="visit our tiktok page"
            class="text-2xl text-emerald-600"
            ><i class="fa-brands fa-tiktok"></i
          ></a>
        </p>

        <p class="font-bold">&copy; 2026 Nairobi Rental Finder</p>
      </div>
    </footer>
    <script>
      function calc() {
        const income = +document.getElementById("income").value;
        const rent = +document.getElementById("rent").value;
        const expenses = +document.getElementById("expenses").value || 0;
        if (!income || !rent)
          return document.getElementById("result").classList.add("hidden");
        const pct = Math.round((rent / income) * 100);
        const maxRent = Math.round(income * 0.3);
        const left = income - rent - expenses;
        document.getElementById("result").classList.remove("hidden");
        const ok = pct <= 30;
        document.getElementById("verdict").textContent = ok
          ? "Yes, You Can Afford It!"
          : "Too Expensive";
        document.getElementById("verdict").className =
          "text-xl font-extrabold " +
          (ok ? "text-emerald-600" : "text-red-600");
        document.getElementById("detail").textContent = ok
          ? `Rent is ${pct}% of income. Max recommended is Ksh ${maxRent.toLocaleString()}. You'll have Ksh ${left.toLocaleString()} left.`
          : `Rent is ${pct}% of income. Max recommended is Ksh ${maxRent.toLocaleString()}. Try a cheaper house or increase income.`;
        document.getElementById("bar").style.width = Math.min(pct, 100) + "%";
        document.getElementById("bar").className =
          "h-3 rounded-full " + (ok ? "bg-emerald-500" : "bg-red-500");
        document.getElementById("percent").textContent =
          `Rent takes ${pct}% of your income (Target: 30% or less)`;
      }
    </script>
  </body>
</html>
