<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Favourites | Nairobi rentals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
  </head>
  <body>
    <nav
      class="flex items-center justify-between px-5 py-4 bg-white shadow-sm sticky top-0 z-10 md:px-10"
    >
      <div class="text-xl font-extrabold">
        Nairobi<span class="text-emerald-600">Rentals</span>
      </div>
      <div class="hidden md:flex gap-6 font-medium text-sm">
        <a href="index.html" class="hover:text-emerald-600">Home</a>
        <a href="listings.html" class="hover:text-emerald-600">Listings</a>
        <a href="about.html" class="hover:text-emerald-600">About</a>
        <a href="about.html#contact" class="hover:text-emerald-600">Contact</a>
      </div>
      <a
        href="add-listing.html"
        class="bg-emerald-600 text-white text-sm font-semibold px-4 py-2 rounded-full hover:bg-emerald-800"
        >Add a Listing
      </a>
    </nav>
    <main class="max-w-6xl mx-auto px-5 md:px-10 py-8">
      <h1 class="text-2xl font-extrabold">My Favourites</h1>
      <p id="count" class="text-sm text-slate-500 mt-2"></p>
      <div
        id="grid"
        class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-6"
      ></div>
      <div id="empty" class="hidden text-center py-16">
        <p class="text-slate-500">
          No favourites yet. Tap the &#9829; on any house.
        </p>
        <a
          href="listings.html"
          class="inline-block mt-4 bg-emerald-600 text-white font-bold px-6 py-2.5 rounded-full"
          >Browse Listings →</a
        >
      </div>
    </main>
    <footer class="bg-white border-t border-slate-200 px-5 py-8 md:px-10">
      <div
        class="flex flex-col md:flex-row md:items-center md:justify-between gap-6 max-w-6xl mx-auto"
      >
        <div class="text-xl font-extrabold">
          Nairobi<span class="text-emerald-600">Rentals</span>
        </div>
        <p>
          Follow us on:
          <a
            href="#"
            aria-label="visit our facebook page"
            class="text-2xl text-emerald-600"
            ><i class="fa-brands fa-square-facebook"></i
          ></a>
          <a
            href="#"
            aria-label="visit our instagram page"
            class="text-2xl text-emerald-600"
            ><i class="fa-brands fa-square-instagram"></i
          ></a>
          <a
            href="#"
            aria-label="visit our tiktok page"
            class="text-2xl text-emerald-600"
            ><i class="fa-brands fa-tiktok"></i
          ></a>
        </p>

        <p class="font-bold">&copy; 2026 Nairobi Rental Finder</p>
      </div>
    </footer>
    <script src="js/script.js"></script>
    <script>
      function renderFav() {
        const favs = JSON.parse(localStorage.getItem("favs") || "[]");
        const userListings = JSON.parse(
          localStorage.getItem("userListings") || "[]",
        );
        const all = [...listings, ...userListings];
        const mine = all.filter((h) => favs.includes(h.id));
        document.getElementById("count").textContent =
          `You saved ${mine.length} houses`;
        document
          .getElementById("empty")
          .classList.toggle("hidden", mine.length > 0);
        document.getElementById("grid").innerHTML = mine
          .map(
            (h) => `
      <article class="bg-white rounded-2xl overflow-hidden shadow-sm">
        <img src="${h.image}" class="w-full h-48 object-cover" />
        <div class="p-5">
          <h3 class="font-bold">${h.title}</h3>
          <p class="text-sm text-slate-500">${h.area}</p>
          <p class="text-emerald-600 font-extrabold mt-2">Ksh ${h.price.toLocaleString()}/month</p>
          <div class="flex gap-2 mt-4">
            <a href="details.html?id=${h.id}" class="flex-1 text-center bg-slate-100 font-bold text-sm py-2 rounded-full">View Details</a>
            <button onclick="removeFav(${h.id})" class="flex-1 bg-red-50 text-red-600 font-bold text-sm py-2 rounded-full">Remove</button>
          </div>
        </div>
      </article>`,
          )
          .join("");
      }
      function removeFav(id) {
        let favs = JSON.parse(localStorage.getItem("favs") || "[]");
        favs = favs.filter((f) => f !== id);
        localStorage.setItem("favs", JSON.stringify(favs));
        renderFav();
      }
      renderFav();
    </script>
  </body>
</html>
